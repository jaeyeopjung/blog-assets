name: cleanup-old-files

# [일시 중지 2026-08-17]
# 네이버가 붙여넣은 이미지를 자사 CDN으로 복사하지 않고
# 원본 URL을 그대로 참조하는 경우가 확인되어 자동 삭제를 중단한다.
# 파일을 지우면 발행된 글의 이미지가 깨진다.
#
# 재개 조건: 발행 글의 이미지 주소가 pstatic.net 계열인지 확인한 뒤,
#           아래 schedule 주석을 해제한다.

on:
  # schedule:
  #   - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete files older than 1 day
        run: |
          set -e
          NOW=$(date +%s)
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              .github/*|README.md) continue ;;
            esac
            TS=$(git log -1 --format=%ct -- "$f")
            [ -n "$TS" ] || continue
            AGE=$(( (NOW - TS) / 86400 ))
            if [ "$AGE" -ge 1 ]; then
              echo "delete: $f (${AGE}d)"
              git rm -q "$f"
            fi
          done

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove files older than 1 day"
            git push
          else
            echo "삭제 대상 없음"
          fi
